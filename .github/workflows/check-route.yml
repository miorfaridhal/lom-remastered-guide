name: Check route

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Data in sync with index.html
        run: |
          node tools/extract.mjs
          git diff --exit-code data/
      - name: Curated order passes every rule
        run: node solver/solve.mjs --check
      - name: Solver finds a valid route
        run: node solver/solve.mjs
