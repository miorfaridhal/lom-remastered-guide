name: Checks

on:
  push:
  pull_request:

jobs:
  data:
    name: Data, route and service worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Data in sync with index.html
        run: |
          node tools/extract.mjs
          git diff --exit-code data/
      - name: Curated order passes every rule
        run: node solver/solve.mjs --check
      - name: Solver finds a valid route
        run: node solver/solve.mjs
      - name: Service worker version matches the shell files
        run: node tools/stamp-sw.mjs --check

  smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
